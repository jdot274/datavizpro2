<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignDataPro Standalone Browser</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #1a1a1a;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .iframe-container {
            flex-grow: 1;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            background-color: #4a4a4a;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #666;
        }
        
        .status {
            font-size: 12px;
            color: #aaa;
        }
        
        .webgl-status {
            padding: 5px 10px;
            background-color: #333;
            border-radius: 4px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>DesignDataPro Standalone Browser</h2>
            <div class="controls">
                <button id="auto-demo-btn">Auto Demo</button>
                <button id="reload-btn">Reload</button>
                <button id="force-webgl-btn">Force WebGL</button>
                <span class="status">WebGL Status: <span id="webgl-status" class="webgl-status">Checking...</span></span>
            </div>
        </div>
        <div class="iframe-container">
            <iframe id="app-iframe" src="http://localhost:3000/auto-demo" allow="fullscreen; autoplay; microphone; camera; display-capture; accelerometer; gyroscope; magnetometer; xr" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Check WebGL support and capabilities
        function checkWebGL() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                document.getElementById('webgl-status').textContent = 'Not Available';
                document.getElementById('webgl-status').style.backgroundColor = '#a00';
                return;
            }
            
            // Get WebGL version and renderer info
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            let renderer = 'Unknown';
            let vendor = 'Unknown';
            
            if (debugInfo) {
                renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            }
            
            document.getElementById('webgl-status').textContent = 'Available: ' + renderer;
            document.getElementById('webgl-status').style.backgroundColor = '#0a0';
            
            // Log detailed WebGL capabilities
            console.log('WebGL Renderer:', renderer);
            console.log('WebGL Vendor:', vendor);
            console.log('MAX_TEXTURE_SIZE:', gl.getParameter(gl.MAX_TEXTURE_SIZE));
            console.log('MAX_VIEWPORT_DIMS:', gl.getParameter(gl.MAX_VIEWPORT_DIMS));
        }
        
        // Execute when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            checkWebGL();
            
            // Navigation buttons
            document.getElementById('auto-demo-btn').addEventListener('click', function() {
                document.getElementById('app-iframe').src = 'http://localhost:3000/auto-demo';
            });
            
            document.getElementById('reload-btn').addEventListener('click', function() {
                document.getElementById('app-iframe').src = document.getElementById('app-iframe').src;
            });
            
            document.getElementById('force-webgl-btn').addEventListener('click', function() {
                const iframe = document.getElementById('app-iframe');
                iframe.contentWindow.postMessage({
                    type: 'FORCE_WEBGL',
                    forceStandard: true
                }, '*');
            });
            
            // Listen for messages from iframe
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'WEBGL_STATUS') {
                    console.log('WebGL Status from app:', event.data.status);
                }
            });
        });
    </script>
</body>
</html>
